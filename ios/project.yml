name: KnowUS
options:
  bundleIdPrefix: bot.tab
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  KnowUS:
    type: application
    platform: iOS
    sources:
      - path: KnowUS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.tab.knowus
        PRODUCT_NAME: KnowUS
        INFOPLIST_FILE: KnowUS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  KnowUS:
    build:
      targets:
        KnowUS: all
    run:
      config: Debug
    archive:
      config: Release
