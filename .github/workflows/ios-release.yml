name: ios-release
# KnowUS iPhone app -> App Store Connect (TestFlight, then App Store review). Run by hand (Actions > ios-release > Run workflow).
# Needs these repository secrets (set by Tab from the vault; never pasted in chat):
#   APPLE_TEAM_ID   the 10-character Team ID of Shmuel's Apple Developer account
#   ASC_KEY_ID      App Store Connect API key ID (key with the Admin role, so Xcode can make the signing certificate)
#   ASC_ISSUER_ID   the Issuer ID shown above the keys list
#   ASC_KEY_P8      the full text of the AuthKey_XXXX.p8 file
# The app record (bundle ID bot.tab.knowus) must exist in App Store Connect first.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version shown in the App Store (e.g. 1.0)'
        required: true
        default: '1.0'
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check the signing secrets
        env:
          T: ${{ secrets.APPLE_TEAM_ID }}
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
          P: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$T" ] || missing="$missing APPLE_TEAM_ID"; [ -n "$K" ] || missing="$missing ASC_KEY_ID"
          [ -n "$I" ] || missing="$missing ASC_ISSUER_ID"; [ -n "$P" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing (needs Shmuel's Apple Developer account)"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ios
      - name: Generate the Xcode project
        run: |
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip && unzip -q -o /tmp/xcodegen.zip -d /tmp/xg || brew install xcodegen
          XG=$(find /tmp/xg -type f -name xcodegen -perm -u+x 2>/dev/null | head -1); [ -n "$XG" ] || XG=$(command -v xcodegen)
          cd ios && "$XG" generate --spec project.yml
      - name: Archive (signed by Xcode with the API key)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -eo pipefail
          mkdir -p ~/private_keys && printf '%s\n' "$P8" > ~/private_keys/AuthKey_$KEY_ID.p8
          xcodebuild -project ios/KnowUS.xcodeproj -scheme KnowUS -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/KnowUS.xcarchive \
            -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" archive | tail -40
      - name: Upload to App Store Connect (TestFlight)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eo pipefail
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/KnowUS.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -40
      - name: Remove the key
        if: always()
        run: rm -rf ~/private_keys
