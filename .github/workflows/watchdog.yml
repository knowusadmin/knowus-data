name: KnowUS watchdog
# Every 3 hours: official results vs the app, sample ballots vs Ballotpedia, missing photos and
# broken links, banned sources. Opens/updates the "KnowUS watchdog" issue when anything is wrong
# and uploads audit-summary.json. Counts that moved on an official page are REFRESHED, not only flagged:
# they are written into data/elections/ (election-official.json, statewide.json, districts/<ST>.json,
# refresh-log.json) and committed to this repo. Free: GitHub-hosted runner on this public repo.
on:
  schedule:
    - cron: "53 */3 * * *"   # away from refresh (:23) and site audit (:41)
  workflow_dispatch:
    inputs:
      only:
        description: "Checks to run (comma separated): results,ballots,pages,banned"
        required: false
        default: "results,ballots,pages,banned"
permissions:
  contents: write
  issues: write
concurrency:
  group: watchdog
  cancel-in-progress: true
jobs:
  watchdog:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04, whose apt mirrors fail on Actions (Nov 11 2026)
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-knowus-retries >/dev/null
          for i in 1 2 3 4; do sudo apt-get update -y -qq && sudo apt-get install -y -qq poppler-utils && break; [ $i = 4 ] && exit 1; echo "apt retry $i (Ubuntu mirror)"; sleep 30; done
          pip install requests beautifulsoup4 lxml playwright
          # Nov 11 2026: GitHub's Ubuntu apt mirrors keep failing DNS mid-download (exit 100), which killed --with-deps.
          # Browser download and system deps are now separate steps with retries; the runner image already carries
          # Chromium's libraries, so a deps step that still fails after 4 tries is a warning, not a failed job.
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-knowus-retries >/dev/null
          for i in 1 2 3; do python -m playwright install chromium && break; [ $i = 3 ] && exit 1; echo "browser download retry $i"; sleep 15; done
          ok=0; for i in 1 2 3 4; do if python -m playwright install-deps chromium; then ok=1; break; fi; echo "install-deps retry $i"; sleep 30; done
          [ $ok = 1 ] || echo "::warning::playwright install-deps failed 4 times (Ubuntu mirror); using the runner image's own libraries"
      - name: Run watchdog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/watchdog.py --issue --summary audit-summary.json --refresh-dir data/elections --only "${{ github.event.inputs.only || 'results,ballots,pages,banned' }}"
      - name: Commit refreshed counts
        if: always()
        run: |
          git config user.name "knowus-bot"
          git config user.email "knowus-bot@users.noreply.github.com"
          git add data/elections 2>/dev/null || true
          if git diff --cached --quiet; then echo "no count changes"; exit 0; fi
          MSG="watchdog: refreshed official counts $(date -u +%Y-%m-%dT%H:%MZ)"
          git commit -q -m "$MSG"
          # data/elections is this run's own output: if another push landed first, lay it on the new head (no rebase of
          # generated JSON, which can conflict and leave the push undone)
          rm -rf /tmp/wd && cp -r data/elections /tmp/wd
          for i in 1 2 3 4; do
            git push -q origin HEAD:main && exit 0
            sleep $((i*5)); git fetch -q origin main && git reset -q --hard origin/main
            rm -rf data/elections && cp -r /tmp/wd data/elections && git add -A data/elections
            git diff --cached --quiet && exit 0
            git commit -q -m "$MSG"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-summary
          path: audit-summary.json
