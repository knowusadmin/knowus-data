# KnowUS website up/down checker. Free: GitHub-hosted runners on this public repo.
# Every 3 hours it re-checks every link that is down or failed last time, plus 1/8 of all links
# (rotating), so every city, county, official and source website is checked at least once a day.
# Results: data/link-status.json (every tracked link) and data/links-down.json (only the down ones;
# the app reads this file and shows "Website currently down" next to those links; the note goes
# away by itself once the site answers again). Commits only when something changed.
name: KnowUS link check
on:
  schedule:
    - cron: "7 */3 * * *"    # 00:07, 03:07, ... UTC (away from the hourly refresh at :23 and the audit at :41)
  workflow_dispatch:
    inputs:
      all:
        description: "Check every link now (not just this slot's eighth)"
        type: boolean
        default: false
      rebuild_targets:
        description: "Re-read the list of links from the live app first"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: link-check
  cancel-in-progress: false
env:
  KNOWUS_SITE: https://knowus.sites.tab.bot/
  PLAYWRIGHT_VERSION: "1.65.0"
jobs:
  check:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04, whose apt mirrors fail on Actions (Nov 11 2026)
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install --quiet aiohttp requests
      - name: Links the app shows (re-read from the live app once a day, so new pages are tracked)
        if: github.event.inputs.rebuild_targets == 'true' || (github.event_name == 'schedule' && startsWith(github.event.schedule, '7 '))
        continue-on-error: true
        run: |
          H=$(date -u +%H)
          if [ "${{ github.event.inputs.rebuild_targets }}" = "true" ] || [ "$H" = "00" ]; then python3 scripts/links_targets.py data/links/targets.json; else echo "not the daily slot"; fi
      - name: Source policy (fails the run if the app cites a source data/sources-policy.json does not allow)
        id: srcpol
        continue-on-error: true
        run: python3 scripts/sources_check.py --out sources-report.json
      - name: Check links (HEAD, then GET; 20 s timeout; 2 retries)
        run: |
          if [ "${{ github.event.inputs.all }}" = "true" ]; then A="--all --budget-min 50"; else A="--budget-min 30"; fi
          python3 scripts/link_check.py check $A
      - name: Count links waiting for a browser check
        id: pend
        run: echo "n=$(python3 -c "import json;print(len(json.load(open('links-pending.json'))['urls']))")" >> "$GITHUB_OUTPUT"
      - name: Cache browser
        if: steps.pend.outputs.n != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Real-browser second opinion (sites that only block bots are not called down)
        if: steps.pend.outputs.n != '0'
        continue-on-error: true
        env:
          VERIFY_CAP: "500"
          VERIFY_MIN: "15"
        run: |
          npm install --no-audit --no-fund --no-save playwright@${PLAYWRIGHT_VERSION}
          # Nov 11 2026: GitHub's Ubuntu apt mirrors keep failing DNS mid-download (exit 100), which killed --with-deps.
          # Browser download and system deps are now separate steps with retries; the runner image already carries
          # Chromium's libraries, so a deps step that still fails after 4 tries is a warning, not a failed job.
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-knowus-retries >/dev/null
          for i in 1 2 3; do npx playwright install chromium && break; [ $i = 3 ] && exit 1; echo "browser download retry $i"; sleep 15; done
          ok=0; for i in 1 2 3 4; do if npx playwright install-deps chromium; then ok=1; break; fi; echo "install-deps retry $i"; sleep 30; done
          [ $ok = 1 ] || echo "::warning::playwright install-deps failed 4 times (Ubuntu mirror); using the runner image's own libraries"
          node scripts/link_verify.mjs
      - name: Decide up / down
        run: python3 scripts/link_check.py finalize
      - name: Commit if anything changed
        run: |
          git config user.name "knowus-bot"
          git config user.email "knowus-bot@users.noreply.github.com"
          git add data/link-status.json data/links-down.json data/links/targets.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          DOWN=$(python3 -c "import json;print(len(json.load(open('data/links-down.json'))['down']))")
          MSG="link check $(date -u +%Y-%m-%dT%H:%MZ): $DOWN down"
          git commit -q -m "$MSG"
          # These three files are this run's own output. When another run (a scheduled one overlapping a manual one, or
          # the refresh) pushed first, a rebase of generated JSON conflicts (Nov 10 19:23Z run 42881323695): start again
          # from the remote head and lay this run's files on top instead of rebasing.
          F="data/link-status.json data/links-down.json data/links/targets.json"
          mkdir -p /tmp/lc && for f in $F; do [ -f "$f" ] && cp "$f" "/tmp/lc/$(echo $f | tr / _)"; done
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && exit 0
            sleep $((i*4)); git fetch -q origin main && git reset -q --hard origin/main
            for f in $F; do [ -f "/tmp/lc/$(echo $f | tr / _)" ] && cp "/tmp/lc/$(echo $f | tr / _)" "$f"; done
            git add $F; git diff --cached --quiet && exit 0
            git commit -q -m "$MSG"
          done
          exit 1
      - name: Source policy result
        if: steps.srcpol.outcome == 'failure'
        run: |
          echo "::error::The app cites sources that data/sources-policy.json does not allow; see sources-report.json in the log above"
          exit 1
